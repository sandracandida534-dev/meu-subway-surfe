<!DOCTYPE html>
<html>
<head>
<title>Vortex Run</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  text-align: center;
  font-family: Arial;
}

#game {
  width: 360px;
  height: 600px;
  background: linear-gradient(#1e90ff, #333);
  margin: auto;
  position: relative;
  overflow: hidden;
}

#player {
  width: 50px;
  height: 80px;
  background: #00ffff;
  position: absolute;
  bottom: 30px;
  left: 155px;
  border-radius: 15px;
}

.coin {
  width: 25px;
  height: 25px;
  background: gold;
  border-radius: 50%;
  position: absolute;
}

#info {
  font-size: 20px;
}
</style>

</head>

<body>

<h1>🏃 Vortex Run</h1>

<div id="info">
🪙 Moedas: <span id="score">0</span>
</div>

<div id="game">
<div id="player"></div>
</div>

<br>

<button onclick="moveLeft()">⬅️</button>
<button onclick="moveRight()">➡️</button>

<script>

let player = document.getElementById("player");
let scoreText = document.getElementById("score");

let lane = 1;
let score = 0;

let lanes = [55,155,255];

function updatePlayer(){
 player.style.left = lanes[lane]+"px";
}

function moveLeft(){
 if(lane > 0){
  lane--;
  updatePlayer();
 }
}

function moveRight(){
 if(lane < 2){
  lane++;
  updatePlayer();
 }
}


function createCoin(){

 let coin = document.createElement("div");
 coin.className="coin";

 let randomLane = Math.floor(Math.random()*3);

 coin.style.left = lanes[randomLane]+"px";
 coin.style.top="0px";

 document.getElementById("game").appendChild(coin);


 let move = setInterval(()=>{

  let y = parseInt(coin.style.top);
  coin.style.top = y + 5 + "px";


  if(y > 560){
   coin.remove();
   clearInterval(move);
  }


  let playerX = player.offsetLeft;
  let coinX = coin.offsetLeft;


  if(y > 500 && playerX == coinX){
   score++;
   scoreText.innerHTML = score;
   coin.remove();
   clearInterval(move);
  }

 },30);

}


setInterval(createCoin,1500);

</script>

</body>
</html>
