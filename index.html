<!DOCTYPE html>
<html>
<head>
<title>Vortex Run</title>

<style>
body {
  margin: 0;
  background: linear-gradient(#222, #555);
  color: white;
  text-align: center;
  font-family: Arial;
}

#game {
  width: 350px;
  height: 600px;
  background: #333;
  margin: auto;
  position: relative;
  overflow: hidden;
}

#player {
  width: 50px;
  height: 80px;
  background: cyan;
  position: absolute;
  bottom: 20px;
  left: 150px;
  border-radius: 10px;
}

.coin {
  width: 25px;
  height: 25px;
  background: gold;
  border-radius: 50%;
  position: absolute;
}

#info {
  font-size: 20px;
  margin: 10px;
}

button {
  padding: 10px;
  margin: 5px;
  font-size: 18px;
}
</style>

</head>

<body>

<h1>🏃 Vortex Run</h1>

<div id="info">
🪙 Moedas: <span id="coins">999999</span>
🔑 Chaves: <span id="keys">999999</span>
🚀 Foguetes: ∞
</div>

<div id="game">
<div id="player"></div>
</div>

<button onclick="left()">⬅️</button>
<button onclick="right()">➡️</button>

<script>

let player = document.getElementById("player");
let pos = 150;

function left(){
 if(pos > 20){
  pos -= 50;
  player.style.left = pos+"px";
 }
}

function right(){
 if(pos < 280){
  pos += 50;
  player.style.left = pos+"px";
 }
}

// moedas infinitas de teste
let coins = 999999;
let keys = 999999;

</script>

</body>
</html>
